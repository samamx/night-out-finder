version: '3.8'

services:

  # PostgreSQL database container
  db:
    image: postgres:15
    container_name: nightout-db
    environment:
      POSTGRES_DB: nightout
      POSTGRES_USER: nightout_user
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"  # maps to 5433 on your Mac to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persists data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightout_user -d nightout"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot app container
  app:
    build: .
    container_name: nightout-app
    ports:
      - "8080:8080"
    environment:
      # Override the database URL to point to the db container, not localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nightout
      SPRING_DATASOURCE_USERNAME: nightout_user
      SPRING_DATASOURCE_PASSWORD: password123
    env_file:
      - .env  # loads your API keys from .env
    depends_on:
      db:
        condition: service_healthy  # waits for PostgreSQL to be ready before starting
    restart: on-failure

volumes:
  postgres_data:  # named volume so data persists between docker-compose restarts